name: servicar
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  hooks_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  flutter_hooks: ^0.21.3+1

  auto_route: ^11.1.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  intl: any

  flutter_svg: ^2.2.3
  responsive_framework: ^1.5.1

  # ─── Database ──────────────────────────────────────────────────
  # Isar v3 is the README-recommended local database
  # (SSoT per README § Coding Guidelines § Core Principles).
  # This is the infrastructure-task migration only — collection
  # schemas live with their owning feature module in week 2+.
  # `isar_flutter_libs` ships the precompiled native binaries
  # (mirrors the README § Technical Specifications intent of a
  # zero-config local store on Android API 21+); `path_provider`
  # resolves the application-documents root for the DB file.
  # `isar_community` is the README § Coding Guidelines /
  # § Technical Specifications database, picked here over the
  # upstream `isar` because the upstream generator pins
  # `analyzer <= 6.x` and the project's locked `analyzer` is
  # `9.0.0` (transitive from `dart_style 3.1.3`).
  # `isar_community` is a drop-in fork: the public API
  # (`Isar.open`, `IsarCollection`, `CollectionSchema`, …)
  # is identical, only the analyzer bound has been raised.
  isar_community: ^3.3.2
  # Native binaries for every supported platform — mirrors the
  # README § Technical Specifications intent of a zero-config
  # local store on Android API 21+.
  isar_community_flutter_libs: ^3.3.2
  # Resolves the application-documents directory for the DB file;
  # also used by future file-system features (PDF invoices,
  # customer attachments, etc.).
  path_provider: ^2.1.5
  isar: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  riverpod_generator: ^4.0.3
  auto_route_generator: ^10.5.0

  flutter_gen_runner: ^5.12.0

  # Isar schema codegen. Runs only when a feature introduces a new
  # @collection class (infrastructure-only tasks like this one do
  # not invoke build_runner).
  # Isar schema codegen. Will be invoked when a feature introduces
  # its first `@collection` class (this infrastructure-only task
  # does NOT call `dart run build_runner`).
  isar_community_generator: ^3.3.2

  flutter_lints: ^6.0.0
  # custom_lint: ^0.8.1
  # riverpod_lint: ^3.1.3

flutter:
  generate: true

  # ─── Vazirmatn (Persian + Latin) ─────────────────────────────────
  # Why bundled, not the Flutter default: Roboto / SF Arabic
  # fall-backs render Persian text inconsistently across Android
  # and iOS. Vazirmatn ships both Persian glyphs and ASCII
  # digits in one family, so the project's "Latin numerals
  # throughout" policy survives without a digit-swap helper. The
  # three weights align one-to-one with `app_typography.dart`'s
  # role weights: w400 (body), w600 (title / label), w700
  # (display / headline). See `lib/config/themes/app_themes.dart`
  # for the wiring.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

dependency_overrides:
  dart_style: 3.1.3



name: servicar
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  hooks_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  flutter_hooks: ^0.21.3+1

  auto_route: ^11.1.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  intl: any

  flutter_svg: ^2.2.3
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  riverpod_generator: ^4.0.3
  auto_route_generator: ^10.5.0

  flutter_gen_runner: ^5.12.0

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.3
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

dependency_overrides:
  analyzer: ^9.0.0
  dart_style: 3.1.3


